# Barnaby orchestrator. Runs on the Pi.

audio:
  # `python -m barnaby --devices` to find these.
  # Input is the ReSpeaker XVF3800, which finally enumerated on 2026-08-22
  # (2886:001a) after a Pi reboot plus an unplug/replug. If it ever vanishes
  # from --devices again, do that before anything else.
  #
  # Output is now the array too (2026-08-26): the speaker hangs off the
  # XVF3800 and the Waveshare USB card is gone. This is what makes barge-in
  # possible — playback through the array gives its echo canceller the
  # reference signal it needs to subtract Barnaby's own voice from the mic.
  #
  # Both are matched by NAME, not card number. The numbers moved when the HDMI
  # panel was plugged in (it adds vc4hdmi0/1), and matching by name is why that
  # did not break anything.
  input_device: "reSpeaker"
  output_device: "reSpeaker"
  input_channels: null   # null = device native. This firmware reports 2.
  # This XVF3800 does NOT expose raw capsules. Its USB descriptor advertises a
  # single 2-channel, 16 kHz S16_LE capture interface (chmap FL,FR) — the XMOS
  # DSP beamforms on-board and returns processed stereo. Measured on ambient
  # room noise the two channels are distinct but highly correlated (r = 0.89),
  # with ch0 ~7 dB hotter than ch1. ch0 is the one to use; there is no separate
  # "raw mic" channel to pick by mistake here.
  input_channel: 0
  # Audio from *before* the trigger, prepended so the first word isn't clipped.
  # It reaches back into the wake phrase too, so too much of it and Whisper
  # transcribes the wake word as part of the question ("Harvest, what's the
  # weather"). Too little and you lose the user's first syllable. 250 is a
  # starting point; retune against the real barnaby model, whose detection
  # latency will differ from hey_jarvis's.
  preroll_ms: 250
  hangover_ms: 350       # silence before we call it done — the latency knob
  min_speech_ms: 250
  max_utterance_ms: 15000
  # Raise toward 0.7 if turns run all the way to max_utterance_ms — that means
  # room noise is reading as speech and the hangover never elapses.
  vad_threshold: 0.5
  barge_in_ms: 200
  # ON as of 2026-08-26, now that playback goes through the array and its echo
  # canceller has a reference to subtract. This is the whole reason the speaker
  # moved off the Waveshare card.
  #
  # UNPROVEN IN A ROOM. The condition the AEC needs is met, but how well the
  # XVF3800 actually cancels at conversational volume is not measured. The
  # failure mode is unmistakable and self-announcing: Barnaby cuts himself off
  # mid-sentence, and the log says `barge-in` on a turn where nobody spoke.
  # If that happens, raise barge_in_ms before switching this back off — a
  # longer confirmation window is the cheaper fix than losing the feature.
  barge_in_enabled: true
  # 16000, NOT 24000. The array's playback endpoint advertises exactly one
  # rate — `Rates: 16000` in /proc/asound/card0/stream0 — so this is not a
  # preference, it is the only thing it accepts. Kokoro returns 24 kHz and the
  # TTS client resamples down to whatever this says. Get it wrong and you get
  # the classic symptom: right words, wrong pitch and speed.
  playback_rate: 16000
  # Playback gain, per stage, as a percentage of each control's range.
  #
  # THE XVF3800 HAS TWO PLAYBACK GAIN STAGES IN SERIES and `amixer sget PCM`
  # shows only the first. The second (`numid=6`) ships at 40/60 = -20 dB and
  # silently eats 20 dB — audible as "he is too quiet" with no other symptom,
  # and invisible to the obvious diagnostic. Set both explicitly.
  #
  # Applied at every startup, deliberately. ALSA mixer levels are kernel state
  # on the Pi: not in git, not carried by deploy.sh, and reverted by a power
  # cut unless someone ran `alsactl store`. Setting them from here makes the
  # level version-controlled and self-healing.
  #
  # [100, 75] was tuned by ear on speech, 2026-08-26. Tune with `--say`, not
  # `speaker-test`: a full-scale sine is far harsher than speech and reads as
  # painfully loud at levels where speech is comfortable.
  #
  # Stage 1 sits 9 dB below where loudness alone would put it, deliberately.
  # Speech here has a ~22 dB crest factor - peaks far above its average - and
  # above this level those peaks buzz. Not digital clipping (clips measure
  # peak 0.45, zero samples at full scale) and not the driver's frequency
  # range (constant-amplitude tones from 500 Hz to 7 kHz are all clean); it is
  # the amplifier or driver distorting on transients. So the ceiling is set by
  # what stays clean on peaks, not by what sounds loud on average. More volume
  # needs a speaker with more headroom, not a bigger number here.
  playback_volume: [100, 75]
  # Speech dynamics, applied to every clip before playback. null disables it.
  #
  # Why this exists: Kokoro's speech has a ~22 dB crest factor, so on this
  # speaker the volume control alone gives you clean OR audible across a room,
  # never both — clean at this level and inaudible at the far end of the
  # kitchen, buzzing on transients 9 dB higher. Compression pulls the peaks
  # down and lifts the whole clip: +8 dB of average loudness at the same peak.
  #
  # Tuned by ear 2026-08-26. Harder settings (ratio 6 and 8) were louder still
  # and sounded worse, so this is not simply "as much as possible".
  playback_compression:
    threshold: 0.12
    ratio: 4.0
    peak: 0.85

wake:
  model: hey_jarvis
  threshold: 0.5         # raise if the TV triggers it

mac:
  # Rapid-MLX serves ONE model per instance, so three ports.
  #   rapid-mlx serve whisper-large-v3-turbo --port 8000
  #   rapid-mlx serve qwen3.6-35b-8bit       --port 8001
  #   rapid-mlx serve kokoro                 --port 8002
  asr_url: http://nicks-mac-studio.local:8000/v1
  asr_model: whisper-large-v3-turbo
  llm_url: http://nicks-mac-studio.local:8100/v1
  llm_model: qwen3.6-35b-8bit
  tts_url: http://nicks-mac-studio.local:8002/v1
  tts_model: kokoro
  # `curl http://<mac>:8002/v1/audio/voices` lists all 53.
  # Naming is <lang><gender>_<name>: a=American b=British, f=female m=male.
  tts_voice: bm_fable
  max_tokens: 400
  temperature: 0.4

home_assistant:
  enabled: true
  base_url: http://homeassistant.local:8123
  token: ${HA_TOKEN}
  agent_id: conversation.home_assistant
  area: Kitchen

face:
  host: 0.0.0.0
  port: 8711

behaviour:
  chirp_on_device_command: true   # beep to acknowledge, speak to inform
  sleep_after_frames: 2250        # ~3 min of nothing -> sleepy
  # Keep listening this long after Barnaby stops speaking, so a follow-up
  # needs no second wake word. 0 disables it.
  #
  # This is an open mic with no wake word in front of it: VAD decides what
  # counts as speech, and VAD cannot tell you from the television. 10 s is
  # generous and conversational; if the kitchen TV starts winning turns, this
  # is the first number to cut. Watch for turns you did not start.
  follow_up_ms: 10000
  # Device commands do not open a window — they never reach history, so a
  # follow-up would have nothing to resolve "and the counter ones too"
  # against. Moot until a real tier 0 exists; Control 4 has no intent matcher.
  follow_up_after_tier0: false
  # Clear conversation history after this long without a turn. Longer than the
  # window on purpose: re-waking inside the session should still resolve a
  # follow-up, but this morning's chat should not be in context tonight.
  session_idle_ms: 180000

targets:
  device_command_ms: 700
  spoken_answer_ms: 2000
