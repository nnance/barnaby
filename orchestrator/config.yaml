# Barnaby orchestrator. Runs on the Pi.

audio:
  # `python -m barnaby --devices` to find these.
  # Input is the ReSpeaker XVF3800, which finally enumerated on 2026-08-22
  # (2886:001a, ALSA card 3) after a Pi reboot plus an unplug/replug. If it
  # ever vanishes from --devices again, do that before anything else.
  # Output is still TEMPORARY — the Waveshare USB sound card, until the JST
  # PH 2.0 pigtail arrives and the speaker can hang off the array itself.
  # Because playback does not go through the array, its AEC has no reference
  # signal, so barge_in_enabled stays false below.
  input_device: "reSpeaker"
  output_device: "USB PnP"
  input_channels: null   # null = device native. This firmware reports 2.
  # This XVF3800 does NOT expose raw capsules. Its USB descriptor advertises a
  # single 2-channel, 16 kHz S16_LE capture interface (chmap FL,FR) — the XMOS
  # DSP beamforms on-board and returns processed stereo. Measured on ambient
  # room noise the two channels are distinct but highly correlated (r = 0.89),
  # with ch0 ~7 dB hotter than ch1. ch0 is the one to use; there is no separate
  # "raw mic" channel to pick by mistake here.
  input_channel: 0
  # Audio from *before* the trigger, prepended so the first word isn't clipped.
  # It reaches back into the wake phrase too, so too much of it and Whisper
  # transcribes the wake word as part of the question ("Harvest, what's the
  # weather"). Too little and you lose the user's first syllable. 250 is a
  # starting point; retune against the real barnaby model, whose detection
  # latency will differ from hey_jarvis's.
  preroll_ms: 250
  hangover_ms: 350       # silence before we call it done — the latency knob
  min_speech_ms: 250
  max_utterance_ms: 15000
  # Raise toward 0.7 if turns run all the way to max_utterance_ms — that means
  # room noise is reading as speech and the hangover never elapses.
  vad_threshold: 0.5
  barge_in_ms: 200
  # OFF while output goes through a separate device. The array's AEC has no
  # reference for audio it didn't play, so Barnaby hears himself and cuts
  # himself off mid-sentence. Turn back on when the speaker moves to the array.
  barge_in_enabled: false
  # Kokoro renders at 24 kHz and the TTS client resamples to whatever this is.
  # Waveshare USB card: 24000 (no resample). If sounddevice rejects it, 48000.
  # When the speaker moves to the array, drop this to 16000 — the XVF3800 caps
  # there, and a mismatch plays everything at the wrong pitch and speed.
  playback_rate: 24000

wake:
  model: hey_jarvis
  threshold: 0.5         # raise if the TV triggers it

mac:
  # Rapid-MLX serves ONE model per instance, so three ports.
  #   rapid-mlx serve whisper-large-v3-turbo --port 8000
  #   rapid-mlx serve qwen3.8-27b-4bit       --port 8001
  #   rapid-mlx serve kokoro                 --port 8002
  asr_url: http://nicks-mac-studio.local:8000/v1
  asr_model: whisper-large-v3-turbo
  llm_url: http://nicks-mac-studio.local:8100/v1
  llm_model: qwen3.8-27b-4bit
  tts_url: http://nicks-mac-studio.local:8002/v1
  tts_model: kokoro
  # `curl http://<mac>:8002/v1/audio/voices` lists all 53.
  # Naming is <lang><gender>_<name>: a=American b=British, f=female m=male.
  tts_voice: bm_fable
  max_tokens: 400
  temperature: 0.4

home_assistant:
  enabled: true
  base_url: http://homeassistant.local:8123
  token: ${HA_TOKEN}
  agent_id: conversation.home_assistant
  area: Kitchen

face:
  host: 0.0.0.0
  port: 8711

behaviour:
  chirp_on_device_command: true   # beep to acknowledge, speak to inform
  sleep_after_frames: 2250        # ~3 min of nothing -> sleepy
  # Keep listening this long after Barnaby stops speaking, so a follow-up
  # needs no second wake word. 0 disables it.
  #
  # This is an open mic with no wake word in front of it: VAD decides what
  # counts as speech, and VAD cannot tell you from the television. 10 s is
  # generous and conversational; if the kitchen TV starts winning turns, this
  # is the first number to cut. Watch for turns you did not start.
  follow_up_ms: 10000
  # Device commands do not open a window — they never reach history, so a
  # follow-up would have nothing to resolve "and the counter ones too"
  # against. Moot until a real tier 0 exists; Control 4 has no intent matcher.
  follow_up_after_tier0: false
  # Clear conversation history after this long without a turn. Longer than the
  # window on purpose: re-waking inside the session should still resolve a
  # follow-up, but this morning's chat should not be in context tonight.
  session_idle_ms: 180000

targets:
  device_command_ms: 700
  spoken_answer_ms: 2000
