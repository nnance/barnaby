[project]
name = "barnaby-orchestrator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "sounddevice>=0.4.6",
  "soundfile>=0.12",
  "httpx>=0.27",
  "websockets>=12.0",
  "pyyaml>=6.0",
  "openwakeword>=0.6",
  "silero-vad>=5.1",
  "onnxruntime>=1.17",
]

[project.scripts]
barnaby = "barnaby.__main__:main"

[tool.ruff]
line-length = 88
target-version = "py311"
